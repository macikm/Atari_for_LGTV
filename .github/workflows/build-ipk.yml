name: Build LG webOS IPK Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Vytvořit / aktualizovat GitHub Release?'
        type: boolean
        required: false
        default: true
      tag_name:
        description: 'Název verze (např. v1.0.0)'
        required: false
        default: 'v1.0.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ipk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalace závislostí včetně LG webOS CLI
        run: |
          npm install

      - name: Sestavení webové distribuce
        run: |
          node scripts/build.js

      - name: Zabalení IPK balíčku
        run: |
          mkdir -p output
          npx -p @webos-tools/cli ares-package dist -o output

      - name: Uložení IPK jako GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtariWebOS-webOS-IPK
          path: output/*.ipk
          if-no-files-found: error

      - name: Publikace IPK do GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'release' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name || 'v1.0.0' }}
          name: AtariWebOS ${{ inputs.tag_name || 'v1.0.0' }}
          files: output/*.ipk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
